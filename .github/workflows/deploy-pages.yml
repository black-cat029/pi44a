name: Deploy pizza catalog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static Next.js site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Make GitHub Pages static-export routes accessible
        shell: bash
        run: |
          while IFS= read -r -d '' html_file; do
            directory="$(dirname "$html_file")"
            route="$(basename "$directory")"
            cp "$html_file" "$directory.txt"
            printf '%s\n' "$route" >> ./out/.nojekyll
          done < <(find ./out -mindepth 2 -type f -name '*.html' -print0)

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
